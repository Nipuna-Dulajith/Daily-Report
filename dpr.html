<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DPR Manager</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#0a0e1a;display:flex;align-items:center;justify-content:center;height:100vh;color:#fff}
.loading{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.loading h2{font-family:monospace;letter-spacing:.1em;font-size:1.1rem;opacity:.7}
.bar{width:220px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#0099cc,#00d4ff);animation:load 1.2s ease-in-out infinite}
@keyframes load{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.err{color:#f87171;font-size:.9rem;max-width:360px;text-align:center;line-height:1.5}
.back-btn{display:inline-block;margin-top:16px;padding:10px 20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:8px;color:#fff;text-decoration:none;font-size:.88rem;cursor:pointer}
.back-btn:hover{background:rgba(255,255,255,.14)}
</style>
</head>
<body>
<div class="loading" id="loading">
  <h2>LOADING DPR MANAGER</h2>
  <div class="bar"><div class="fill"></div></div>
  <div style="font-family:monospace;font-size:.7rem;opacity:.35;letter-spacing:.1em" id="loadMsg">Checking session…</div>
</div>

<script>
// Session check
const raw = localStorage.getItem('dpr_session') || sessionStorage.getItem('dpr_session');
if(!raw){ window.location.href='./index.html'; }
else{
  try{
    const s=JSON.parse(raw);
    if(s.expires < Date.now()){ localStorage.removeItem('dpr_session'); window.location.href='./index.html'; }
  }catch(e){ window.location.href='./index.html'; }
}

// Get project ID from URL
const params = new URLSearchParams(window.location.search);
const projectId = params.get('project');
const view = params.get('view')||'archive';

if(!projectId){
  document.getElementById('loading').innerHTML=`
    <div class="err">No project specified.<br>Please open a project from the dashboard.</div>
    <a class="back-btn" href="./app.html">← Back to Dashboard</a>`;
} else {
  document.getElementById('loadMsg').textContent='Loading project data…';
  // Store so dpr-manager.html can pick it up
  localStorage.setItem('dpr_currentProject', projectId);
  localStorage.setItem('dpr_openView', view);
  // Redirect to the main DPR manager, passing project
  setTimeout(()=>{
    window.location.href = './qspro_dpr_manager.html?project=' + projectId + '&view=' + view + '&from=app';
  }, 400);
}
</script>
</body>
</html>
